# docker-compose.yml
services:
  server:
    image: postgrest/postgrest
    container_name: ${COMPOSE_PROJECT_NAME}-postgrest-$COMPOSE_PROJECT_INDEX
    hostname: server
    # Only expose internally, not to the host
    # ports:
    #   - "${PORT_PGREST}:3000"  # PostgREST runs on port 3000 internally
    environment:
      PGRST_DB_URI: postgres://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
      # Set proxy URI to the Nginx host:port visible to the browser
      PGRST_OPENAPI_SERVER_PROXY_URI: http://localhost:${PORT_NGINX}
      PGRST_DB_SCHEMA: ${PGRST_DB_SCHEMA}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE}
      PGRST_DB_POOL: ${PGRST_DB_POOL}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_MAX_ROWS: ${PGRST_MAX_ROWS}
      # Disable CORS in PostgREST - we'll handle it in NGINX
      PGRST_SERVER_CORS_ALLOW_ORIGIN: ""
    volumes:
      - ./data/postgrest:/var/lib/postgrest/data
    restart: always
    networks:
      - app-network
      
  swagger:
    image: swaggerapi/swagger-ui
    container_name: ${COMPOSE_PROJECT_NAME}-swaggerapi-$COMPOSE_PROJECT_INDEX
    hostname: swagger
    ports:
      - "${PORT_SWAGGER}:8080"
    environment:
      # Use URL visible to the browser, not Docker network names
      SWAGGER_JSON_URL: "http://localhost:${PORT_NGINX}/openapi.json"
      API_URL: "http://localhost:${PORT_NGINX}"
      URL: "http://localhost:${PORT_NGINX}/openapi.json"
      # Add API port for swagger-initializer.js to use
      API_PORT: "${PORT_NGINX}"
      
      # Configure Swagger to use API key authentication
      SWAGGER_UI_APIKEYS: '[{"name":"X-Api-Key","in":"header","value":"${API_KEY}","type":"apiKey"}]'
      SWAGGER_UI_PERSIST_AUTHORIZATION: "true"
      
      # Disable validation to prevent initial errors
      SWAGGER_UI_DISABLE_VALIDATOR: "true"
      SWAGGER_UI_LAYOUT: "BaseLayout"

      # Other UI settings
      SWAGGER_UI_SUPPORTEDSUBMITMETHODS: "['get', 'put', 'post', 'delete', 'options', 'head', 'patch', 'trace']"
      DISPLAY_REQUEST_DURATION: "true"
      DEFAULT_MODELS_EXPAND_DEPTH: "2"
      DOC_EXPANSION: "list"
      THEME: "material"
    volumes:
      - ./data/swagger/index.html:/usr/share/nginx/html/index.html
      - ./data/swagger/docker-entrypoint-wrapper.sh:/docker-entrypoint-wrapper.sh
      - ./data/swagger/swagger-initializer.js:/tmp/swagger-initializer-custom.js
    command: ["sh", "-c", "/docker-entrypoint-wrapper.sh && cp /tmp/swagger-initializer-custom.js /usr/share/nginx/html/swagger-initializer.js && /docker-entrypoint.sh nginx -g 'daemon off;'"]
    restart: always
    networks:
      - app-network
      
  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME}-nginx-$COMPOSE_PROJECT_INDEX
    hostname: nginx
    ports:
      - "${PORT_NGINX}:80"  # Expose on port defined in .env
    volumes:
      - ./data/nginx/default.conf.template:/etc/nginx/conf.d/default.conf.template
      - ./data/nginx/docker-entrypoint-wrapper.sh:/docker-entrypoint-wrapper.sh
    environment:
      - API_KEY=${API_KEY}
    command: ["/docker-entrypoint-wrapper.sh"]
    depends_on:
      - server
    restart: always
    networks:
      - app-network

networks:
  app-network:
    driver: bridge