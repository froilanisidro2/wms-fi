server {
    listen 80;
    
    # Set the API key value from the .env file
    # This will be replaced by the wrapper script with the value from API_KEY env var
    set $api_key_value "API_KEY_PLACEHOLDER";
    
    # Simple CORS configuration - allow all origins
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Api-Key,X-PINGOTHER,Accept' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Range' always;
    
    # Add security headers for all responses
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Handle OPTIONS preflight requests
    if ($request_method = 'OPTIONS') {
        return 204;
    }
    
    # Special handling for OpenAPI schema - allow without API key for Swagger UI
    location = /openapi.json {
        # No API key check for OpenAPI schema
        # Correct way to request OpenAPI schema from PostgREST - request root with Accept header
        proxy_pass http://server:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Accept "application/openapi+json";
        
        # Explicitly remove any CORS headers that might be set by upstream
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Expose-Headers';
        proxy_hide_header 'Access-Control-Allow-Credentials';
        
        # Add our own CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Api-Key,X-PINGOTHER,Accept' always;
    }
    
    # Forward everything to PostgREST
    location / {
        # Check API key
        set $auth_header $http_x_api_key;
        
        if ($auth_header != $api_key_value) {
            return 401 '{"error":"Unauthorized - API Key Required","message":"Please provide a valid API key in the X-Api-Key header"}';
        }
        
        proxy_pass http://server:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
        
        # Explicitly remove any CORS headers that might be set by upstream
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Expose-Headers';
        proxy_hide_header 'Access-Control-Allow-Credentials';
    }
    
    # Explicitly block direct access to PostgreSQL
    location ~* ^/rpc/(pg_*|postgres_*) {
        deny all;
        return 403 '{"error":"Forbidden","message":"Direct database function access is not allowed"}';
    }
}
